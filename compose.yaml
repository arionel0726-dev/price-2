services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricewatch
      POSTGRES_PASSWORD: pricewatch_dev
      POSTGRES_DB: pricewatch
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pricewatch -d pricewatch']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
