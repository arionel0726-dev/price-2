<!doctype html>
<!-- Sanitized Magento fixture: multiple .radio-volume options with no
     selected/active/checked marker — the adapter must return null for
     volume here rather than guessing which one is current. -->
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<title>Avignon EDT Vapo</title>
</head>
<body class="catalog-product-view product-page-layout">
	<main class="product-page">
		<h1 class="product-page__details-name">Avignon EDT Vapo</h1>
		<div class="product-page__details-code sku" data-product-sku="OVC-AVG-MULTI">Код товара: OVC-AVG-MULTI</div>
		<div class="product-page__options">
			<div class="radio-volume">50 ml</div>
			<div class="radio-volume">100 ml</div>
		</div>
	</main>
</body>
</html>
