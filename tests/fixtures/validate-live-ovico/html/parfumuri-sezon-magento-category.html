<!doctype html>
<!-- Sanitized Magento category/listing page — a flat /ru/<slug> URL that
     is NOT a product page, distinguished by Magento structure (no
     .product-page container; a product grid instead), not URL shape
     alone (Task 7.1 §7). -->
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<title>Сезонные ароматы</title>
</head>
<!-- Layout Handles: default catalog_category_view -->
<body class="catalog-category-view">
	<main>
		<h1>Сезонные ароматы</h1>
		<div class="products-grid">
			<div class="product-item"><a href="/ru/avignon-edt-50ml-vapo">Avignon EDT 50ml</a></div>
			<div class="product-item"><a href="/ru/dior-sauvage-edt-100ml">Dior Sauvage EDT 100ml</a></div>
			<div class="product-item"><a href="/ru/chanel-no5-edp-50ml">Chanel No5 EDP 50ml</a></div>
		</div>
	</main>
</body>
</html>
